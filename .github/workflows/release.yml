name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libgtk-3-dev libayatana-appindicator3-dev

      - name: Write signing key to file
        shell: bash
        run: echo "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" > /tmp/tauri.key

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY_PATH: /tmp/tauri.key
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload Windows artifacts
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.nsis.zip
            src-tauri/target/release/bundle/nsis/*.nsis.zip.sig

      - name: Upload macOS artifacts
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig

      - name: Upload Linux artifacts
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz
            src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz.sig
            src-tauri/target/release/bundle/deb/*.deb

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: find artifacts -type f

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Generate latest.json
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          TAG="${{ github.ref_name }}"
          BASE_URL="https://github.com/hydrionz/NetDebugger/releases/download/${TAG}"

          # Find files with fallback
          find_file() { find "$1" -name "$2" 2>/dev/null | head -1; }

          WIN_NSIS_ZIP=$(find_file artifacts/windows '*_x64-setup.nsis.zip')
          WIN_SIG_FILE=$(find_file artifacts/windows '*.nsis.zip.sig')
          MACOS_TAR=$(find_file artifacts/macos '*_aarch64.app.tar.gz')
          MACOS_SIG_FILE=$(find_file artifacts/macos '*.app.tar.gz.sig')
          LINUX_TAR=$(find_file artifacts/linux '*_amd64.AppImage.tar.gz')
          LINUX_SIG_FILE=$(find_file artifacts/linux '*.AppImage.tar.gz.sig')

          # Read signatures (empty string if file not found)
          WIN_SIG=$( [ -n "$WIN_SIG_FILE" ] && cat "$WIN_SIG_FILE" || echo "" )
          MACOS_SIG=$( [ -n "$MACOS_SIG_FILE" ] && cat "$MACOS_SIG_FILE" || echo "" )
          LINUX_SIG=$( [ -n "$LINUX_SIG_FILE" ] && cat "$LINUX_SIG_FILE" || echo "" )

          echo "WIN_NSIS_ZIP=$WIN_NSIS_ZIP"
          echo "MACOS_TAR=$MACOS_TAR"
          echo "LINUX_TAR=$LINUX_TAR"

          jq -n \
            --arg version "v${VERSION}" \
            --arg notes "NetDebugger v${VERSION}" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg win_sig "$WIN_SIG" \
            --arg win_url "${BASE_URL}/$(basename $WIN_NSIS_ZIP)" \
            --arg mac_sig "$MACOS_SIG" \
            --arg mac_url "${BASE_URL}/$(basename $MACOS_TAR)" \
            --arg lin_sig "$LINUX_SIG" \
            --arg lin_url "${BASE_URL}/$(basename $LINUX_TAR)" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "windows-x86_64": { signature: $win_sig, url: $win_url },
                "darwin-aarch64": { signature: $mac_sig, url: $mac_url },
                "linux-x86_64": { signature: $lin_sig, url: $lin_url }
              }
            }' > latest.json

          echo "=== latest.json ==="
          cat latest.json

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "NetDebugger ${{ github.ref_name }}" \
            --generate-notes \
            $(find artifacts -type f) \
            latest.json
