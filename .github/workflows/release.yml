name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          # TODO: 项目成熟后取消注释以支持 macOS / Linux 构建
          # - platform: macos-latest
          #   target: aarch64-apple-darwin
          # - platform: ubuntu-22.04
          #   target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Write signing key to file
        shell: bash
        run: echo "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" > /tmp/tauri.key

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY_PATH: /tmp/tauri.key
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload Windows artifacts
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v5
        with:
          name: windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/nsis/*.nsis.zip
            src-tauri/target/release/bundle/nsis/*.nsis.zip.sig

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: find artifacts -type f

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Generate latest.json
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          TAG="${{ github.ref_name }}"
          BASE_URL="https://github.com/hydrionz/NetDebugger/releases/download/${TAG}"

          echo "=== artifacts tree ==="
          find artifacts -type f -ls 2>/dev/null || true
          echo "=== ls -R artifacts ==="
          ls -R artifacts 2>/dev/null || true

          # Find files with fallback ( Tauri v2 NSIS may produce .exe + .exe.sig or .nsis.zip + .nsis.zip.sig )
          # Search in artifacts (recursive) to handle windows/nsis subdirs
          find_file() { find artifacts -name "$1" 2>/dev/null | head -1; }

          WIN_BUNDLE=$(find_file '*_x64-setup.exe')
          if [ -z "$WIN_BUNDLE" ]; then WIN_BUNDLE=$(find_file '*_x64-setup.nsis.zip'); fi
          if [ -z "$WIN_BUNDLE" ]; then WIN_BUNDLE=$(find_file '*.nsis.zip'); fi
          if [ -z "$WIN_BUNDLE" ]; then WIN_BUNDLE=$(find_file '*.exe'); fi

          WIN_SIG_FILE="${WIN_BUNDLE}.sig"
          if [ ! -f "$WIN_SIG_FILE" ]; then WIN_SIG_FILE=$(find_file '*.exe.sig'); fi
          if [ ! -f "$WIN_SIG_FILE" ]; then WIN_SIG_FILE=$(find_file '*.nsis.zip.sig'); fi
          # Fallback: any .sig
          if [ ! -f "$WIN_SIG_FILE" ]; then WIN_SIG_FILE=$(find_file '*.sig'); fi

          # Read signature (empty if not found — updater will still try, but log it)
          WIN_SIG=$( [ -n "$WIN_SIG_FILE" ] && [ -f "$WIN_SIG_FILE" ] && cat "$WIN_SIG_FILE" || echo "" )

          echo "WIN_BUNDLE=$WIN_BUNDLE"
          echo "WIN_SIG_FILE=$WIN_SIG_FILE"
          echo "WIN_SIG length=${#WIN_SIG}"

          if [ -z "$WIN_BUNDLE" ]; then
            echo "::error::Windows bundle not found (expected *_x64-setup.exe or *.nsis.zip) — listing artifacts:"
            find artifacts -type f 2>/dev/null || true
            ls -R artifacts 2>/dev/null || true
            exit 1
          fi
          if [ -z "$WIN_SIG" ]; then
            echo "::warning::Windows signature empty — check TAURI_SIGNING_PRIVATE_KEY"
          fi

          jq -n \
            --arg version "v${VERSION}" \
            --arg notes "NetDebugger v${VERSION}" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg win_sig "$WIN_SIG" \
            --arg win_url "${BASE_URL}/$(basename $WIN_BUNDLE)" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "windows-x86_64": { signature: $win_sig, url: $win_url }
              }
            }' > latest.json

          echo "=== latest.json ==="
          cat latest.json

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "NetDebugger ${{ github.ref_name }}" \
            --generate-notes \
            $(find artifacts -type f) \
            latest.json
