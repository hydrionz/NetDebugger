[package]
name = "app"
version = "0.1.6"
description = "Cross-platform network protocol debugger"
authors = ["zz"]
license = "Apache-2.0"
repository = "https://github.com/hydrionz/NetDebugger"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
tauri = { version = "2.9.2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = { version = "2", features = ["rustls-tls"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
tokio-rusqlite = "0.6"
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
futures-util = "0.3"
chrono = "0.4"
serde_bytes = "0.11"
libsqlite3-sys = { version = "0.35", features = ["bundled"] }
rfd = "0.15"
base64 = "0.22"
regex = "1"
